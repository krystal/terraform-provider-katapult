lefthook: mise exec -- lefthook

pre-commit:
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    go-vet:
      glob: "*.go"
      run: go vet ./...
    taplo:
      glob: "*.toml"
      run: mise exec -- taplo fmt {staged_files}
      stage_fixed: true
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint {staged_files}
    pinact:
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- pinact run --fix=false --no-api {staged_files}
