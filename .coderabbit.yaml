# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true

reviews:
  review_status: true
  auto_review:
    enabled: false
    labels:
      - "coderabbit:review"
  path_filters:
    - "!**/testdata/**/*.cassette.*"
  pre_merge_checks:
    # Around half of this provider's functions are Terraform Plugin Framework
    # interface methods (Metadata, Configure, Schema, CRUD, ImportState,
    # Invoke) whose signatures already say everything a comment would. A
    # coverage percentage cannot tell those apart from functions with real
    # logic, so no threshold is meaningful here. golangci-lint enforces Go doc
    # comment conventions through revive and godot instead.
    docstrings:
      mode: "off"
