version: "2"
run:
  modules-download-mode: readonly
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - dupl
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nilerr
    - noctx
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    funlen:
      lines: 150
      statements: 200
    goconst:
      min-occurrences: 5
      # Terraform schema keys and repeated schema descriptions are declarative
      # vocabulary, not application values that benefit from Go constants.
      ignore-string-values:
        - '^(Always set to provider organization value\.|The ID of this resource\.|address|color|data_center_id|exists|ip_addresses|katapult_virtual_machine|load_balancer_id|name|network_id|not_found|notes|permalink|ports|protocol|tag_ids|targets|virtual_machine_group_ids|virtual_machine_ids)$'
    gocyclo:
      min-complexity: 20
    govet:
      disable:
        - fieldalignment
      enable-all: true
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'SA1019: resource.StateChangeConf is deprecated'
      - linters:
          - dupl
          - funlen
          - goconst
        path: _test\.go
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - lll
        source: '`json:'
      - path: (.+)\.go$
        text: Using the variable on range scope `tt` in function literal
      - path: (.+)\.go$
        text: Using the variable on range scope `tc` in function literal
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
